name: Linux binary

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make pkg-config \
            zlib1g-dev \
            libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - name: Configure and build
        run: |
          cmake --preset default \
            -DCMAKE_BUILD_TYPE=Release \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          cmake --build build --target GalaxyEditor -j"$(nproc)"

      - name: Build DEB package
        run: |
          cd build
          cpack -G DEB

      # Tag releases are published by release.yml, which attaches this tarball
      # and the .deb together with the macOS and Windows packages.
      - name: Package tarball
        run: |
          scripts/fetch-companion-hpi.sh
          scripts/package-linux.sh

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyEditor-linux-x64-deb
          path: build/*.deb
          if-no-files-found: error

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyEditor-linux-x64-tarball
          path: GalaxyEditor-*.tar.gz
          if-no-files-found: error
